<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>戰鬥陀螺上架監控</title>
<style>
  :root{ --bg:#0f1115; --card:#1a1d24; --muted:#8b93a1; --line:#2a2f3a;
         --green:#22c55e; --red:#ef4444; --amber:#f59e0b; --blue:#3b82f6; }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:#e6e9ef}
  header{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0}
  .meta{color:var(--muted);font-size:13px}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .wrap{padding:18px 22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
  .model{font-size:20px;font-weight:700;letter-spacing:.5px}
  .title{color:var(--muted);font-size:13px;min-height:18px;line-height:1.4}
  .badge{align-self:flex-start;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
  .b-off{background:#2a2f3a;color:#9aa3b2}
  .b-buy{background:rgba(34,197,94,.15);color:var(--green)}
  .b-out{background:rgba(239,68,68,.15);color:var(--red)}
  button.confirm{margin-top:auto;border:0;border-radius:9px;padding:11px;font-size:15px;font-weight:700;cursor:pointer;transition:.15s}
  .ready{background:var(--green);color:#04210f}
  .ready:hover{filter:brightness(1.08)}
  .disabled{background:#242832;color:#5a6270;cursor:not-allowed}
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#111827;border:1px solid var(--line);
         padding:12px 18px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:90vw}
  #toast.show{opacity:1}
  .ok{border-color:var(--green)} .err{border-color:var(--red)}
  a.link{color:var(--blue);text-decoration:none;font-size:12px}
  #banner{margin:0 22px;padding:0;font-size:14px;font-weight:600;border-radius:10px;overflow:hidden;transition:.2s}
  #banner.show{padding:11px 16px;margin:14px 22px 0}
  #banner.warn{background:rgba(239,68,68,.15);color:#fecaca;border:1px solid rgba(239,68,68,.4)}
  #banner.good{background:rgba(34,197,94,.12);color:#bbf7d0;border:1px solid rgba(34,197,94,.35)}
  .result{font-size:12px;min-height:16px;margin-top:2px}
  .result.rok{color:var(--green)} .result.rerr{color:#fca5a5}
  #controlbar{display:flex;align-items:center;gap:16px;margin:14px 22px 0;padding:12px 16px;
              background:var(--card);border:1px solid var(--line);border-radius:12px;flex-wrap:wrap}
  .selall{font-size:13px;color:#cbd2dd;display:flex;align-items:center;gap:6px;cursor:pointer}
  #selinfo{font-size:13px}
  button.batch{margin-left:auto;border:0;border-radius:9px;padding:11px 20px;font-size:15px;font-weight:700;cursor:pointer;transition:.15s}
  button.batch.ready{background:var(--blue);color:#fff}
  button.batch.ready.pulse{animation:pulse 1s ease-in-out infinite}
  button.batch.ready:hover{filter:brightness(1.1)}
  button.batch.disabled{background:#242832;color:#5a6270;cursor:not-allowed}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(59,130,246,.5)}50%{box-shadow:0 0 0 8px rgba(59,130,246,0)}}
  .pick{display:flex;align-items:center;gap:6px;font-size:12px;color:#9aa3b2;cursor:pointer;user-select:none}
  .pick input{width:15px;height:15px}
  .mrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
  button.autotgl{border:0;border-radius:7px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
  button.autotgl.on{background:rgba(34,197,94,.18);color:#22c55e}
  button.autotgl.off{background:rgba(239,68,68,.20);color:#f87171}
  .card.disabled{opacity:.72}
  .card{position:relative}
  button.rmv{position:absolute;top:6px;left:6px;width:20px;height:20px;border:0;border-radius:6px;
             background:#242832;color:#8b93a1;font-size:12px;line-height:1;cursor:pointer;
             opacity:.35;transition:.15s;z-index:2;padding:0}
  .card:hover button.rmv{opacity:1}
  button.rmv:hover{background:rgba(239,68,68,.25);color:#f87171}
  button.prio{position:absolute;right:8px;bottom:8px;width:26px;height:26px;border-radius:50%;
              border:1px solid var(--line);background:#242832;color:#8b93a1;
              font:700 13px system-ui,sans-serif;cursor:pointer;z-index:2;padding:0;
              display:flex;align-items:center;justify-content:center;opacity:.5;transition:.15s}
  .card:hover button.prio{opacity:1}
  button.prio.set{background:var(--blue);color:#fff;border-color:var(--blue);opacity:1;
                  box-shadow:0 0 0 2px rgba(59,130,246,.25)}
  button.prio:hover{opacity:1}
  #tabs{display:flex;gap:8px;margin:14px 22px 0}
  button.tab{border:0;border-radius:9px 9px 0 0;padding:9px 18px;font-size:14px;font-weight:700;cursor:pointer;background:#1a1d24;color:#8b93a1}
  button.tab.active{background:var(--card);color:#e6e9ef;border-bottom:2px solid var(--blue)}
  button.storebtn{border:0;border-radius:9px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer}
  button.storebtn.on{background:rgba(34,197,94,.18);color:#22c55e}
  button.storebtn.off{background:rgba(239,68,68,.20);color:#f87171}
  button.refresh{margin-left:8px;border:0;border-radius:9px;padding:9px 16px;font-size:14px;font-weight:700;
                 background:var(--green);color:#04210f;cursor:pointer;transition:.15s}
  button.refresh:hover{filter:brightness(1.08)}
  button.refresh:disabled{background:#242832;color:#5a6270;cursor:default}
  button.cartbtn{border:0;border-radius:9px;padding:9px 16px;font-size:14px;font-weight:700;
                 background:var(--blue);color:#fff;cursor:pointer;transition:.15s}
  button.cartbtn:hover{filter:brightness(1.1)}
  table.log{width:100%;border-collapse:collapse;font-size:13px}
  table.log th,table.log td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  table.log th{color:var(--muted);font-weight:600;font-size:12px}
  table.log tr:hover{background:rgba(255,255,255,.03)}
  .ev-ok{color:var(--green)} .ev-bad{color:var(--red)} .ev-info{color:#93c5fd}
  .ev-time{color:var(--muted);white-space:nowrap;font-family:Consolas,monospace}
  .ev-store{display:inline-block;padding:2px 8px;border-radius:999px;background:#2a2f3a;font-size:11px}
  .sumbar{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:12px;font-size:13px;color:var(--muted)}
  .sumbar b{color:#e6e9ef;font-size:15px}
</style>
</head>
<body>
<header>
  <h1>🌀 戰鬥陀螺上架監控</h1>
  <span class="meta" id="clock">連線中…</span>
  <span class="meta">（每 3 秒更新畫面；後端定時查商店）</span>
  <button id="bindBtn" class="cartbtn" style="margin-left:auto;background:#2a2f3a;color:#cbd2dd">🔗 綁定寄件信箱…</button>
  <button id="mailBtn" class="cartbtn" style="margin-left:8px;background:rgba(59,130,246,.20);color:#93c5fd">📥 收信信箱…</button>
  <button id="cartBtn" class="cartbtn" style="margin-left:8px">🛒 前往購物車</button>
  <button id="refreshBtn" class="refresh">🔄 立刻偵測</button>
</header>
<div id="tabs">
  <button class="tab active" data-tab="funbox">🧸 Funbox</button>
  <button class="tab" data-tab="eslite">📚 誠品</button>
  <button class="tab" data-tab="tcsb">🪜 墊腳石</button>
  <button class="tab" data-tab="momo">🛍️ momo</button>
  <button class="tab" data-tab="ehobby">🏯 東海</button>
  <button class="tab" data-tab="mm">🧩 M.M小舖</button>
  <button class="tab" data-tab="log">📋 動作紀錄</button>
  <button id="fbModeBtn" class="storebtn" style="margin-left:auto;display:none"></button>
  <button id="esModeBtn" class="storebtn" style="margin-left:auto;display:none"></button>
  <button id="tcsbModeBtn" class="storebtn" style="margin-left:auto;display:none"></button>
  <button id="addBtn" class="storebtn" style="background:rgba(59,130,246,.18);color:#60a5fa">＋ 新增項目</button>
  <button id="storeBtn" class="storebtn" style="margin-left:8px">偵測中</button>
</div>
<div id="banner"></div>
<div id="cfgerr" style="display:none;margin:14px 22px 0;padding:11px 16px;border-radius:10px;background:rgba(239,68,68,.18);color:#fecaca;border:1px solid rgba(239,68,68,.5);font-size:14px;font-weight:700"></div>
<div id="controlbar">
  <label class="selall"><input type="checkbox" id="selAll"> 全選可買</label>
  <span id="selinfo" class="meta">尚未選取</span>
  <button id="batchBtn" class="batch disabled" disabled>🛒 確認加入選取項目</button>
</div>
<div class="wrap" id="cards"></div>
<div id="toast"></div>
<div id="toModal" style="display:none;position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.6);align-items:center;justify-content:center">
  <div style="width:440px;max-width:92vw;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.6)">
    <div style="font-size:17px;font-weight:800;margin-bottom:4px">📥 收信信箱（可多個）</div>
    <div class="meta" style="margin-bottom:14px">有貨/新上架的通知會同時寄給清單裡每一位。被停用或 ✕ 的品項不寄。</div>
    <div id="to_list" style="margin-bottom:12px"></div>
    <div style="display:flex;gap:8px;margin-bottom:8px">
      <input id="to_new" type="text" placeholder="新增收件信箱 yourname@example.com" autocomplete="off"
        style="flex:1;padding:9px 11px;border-radius:8px;background:#1a1d24;color:#e6e9ef;border:1px solid var(--line)">
      <button id="to_add" style="flex:0 0 auto;padding:9px 16px;border:0;border-radius:8px;cursor:pointer;background:var(--green);color:#04210f;font-weight:800">＋ 新增</button>
    </div>
    <div id="to_msg" class="meta" style="min-height:16px;margin-bottom:12px"></div>
    <div style="text-align:right">
      <button id="to_close" style="padding:9px 18px;border:0;border-radius:8px;cursor:pointer;background:#242832;color:#9aa3b2;font-weight:700">關閉</button>
    </div>
  </div>
</div>
<div id="mailModal" style="display:none;position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.6);align-items:center;justify-content:center">
  <div style="width:460px;max-width:92vw;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.6)">
    <div style="font-size:17px;font-weight:800;margin-bottom:4px">🔗 綁定寄件信箱</div>
    <div class="meta" style="margin-bottom:16px">設定「用哪個 Gmail 帳號寄通知信」。三步，同一個畫面填完即可。</div>

    <div style="font-size:13px;color:#cbd2dd;margin-bottom:6px">① 寄件 Gmail 地址</div>
    <input id="mm_user" type="text" placeholder="例如 yourname@gmail.com" autocomplete="off"
      style="width:100%;padding:9px 11px;border-radius:8px;background:#1a1d24;color:#e6e9ef;border:1px solid var(--line);margin-bottom:14px">

    <div style="font-size:13px;color:#cbd2dd;margin-bottom:6px">② 到 Google 產生 16 碼應用程式密碼</div>
    <button id="mm_open" style="width:100%;padding:10px;border:0;border-radius:8px;cursor:pointer;background:var(--blue);color:#fff;font-weight:700;margin-bottom:4px">🔗 開啟 Google 應用程式密碼頁</button>
    <div class="meta" style="margin-bottom:14px;line-height:1.7">先用要寄件的那個 Gmail 登入、且已開兩步驟驗證；名稱隨便填→建立→複製 16 碼。</div>

    <div style="font-size:13px;color:#cbd2dd;margin-bottom:6px">③ 貼上 16 碼（有空格沒關係）</div>
    <input id="mm_pw" type="password" placeholder="xxxx xxxx xxxx xxxx" autocomplete="off"
      style="width:100%;padding:9px 11px;border-radius:8px;background:#1a1d24;color:#e6e9ef;border:1px solid var(--line);margin-bottom:8px">
    <label class="meta" style="display:flex;align-items:center;gap:6px;margin-bottom:16px;cursor:pointer">
      <input id="mm_show" type="checkbox"> 顯示密碼確認沒貼錯
    </label>

    <div style="display:flex;gap:10px">
      <button id="mm_cancel" style="flex:0 0 auto;padding:10px 16px;border:0;border-radius:8px;cursor:pointer;background:#242832;color:#9aa3b2;font-weight:700">取消</button>
      <button id="mm_save" style="flex:1;padding:10px;border:0;border-radius:8px;cursor:pointer;background:var(--green);color:#04210f;font-weight:800">儲存並寄測試信</button>
    </div>
    <div id="mm_msg" class="meta" style="margin-top:10px;min-height:16px"></div>
  </div>
</div>

<script>
let prevBuyable = {};
let lastState = null;
let autoAddOn = false;   // 由 /api/health 帶入；決定要不要顯示手動確認/勾選
let disabledSet = new Set();   // 個別關閉自動加入（鍵是「商店:品項」，各分頁互不影響）
function offKey(store, name){ return store + ':' + name; }
function isOff(store, name){ return disabledSet.has(offKey(store, name)); }
let activeTab = 'funbox';
let prevEsl = {};
let prevMomo = {};
let prevTcsb = {};
let prevEh = {};
let prevMm = {};
let storesState = {funbox:true, eslite:true, momo:true, tcsb:true, ehobby:true, mm:true};
const results = {};

let fbAutoMode = null;   // funbox 下單模式（由 /api/health 帶入）
let esAutoMode = null;   // 誠品 下單模式（由 /api/health 帶入）
let tcsbAutoMode = null; // 墊腳石 下單模式（由 /api/health 帶入）
function updateFbModeBtn(){
  const fb = document.getElementById('fbModeBtn');
  const es = document.getElementById('esModeBtn');
  const tc = document.getElementById('tcsbModeBtn');
  const ab = document.getElementById('addBtn');
  const showFb = (activeTab === 'funbox');
  const showEs = (activeTab === 'eslite');
  const showTc = (activeTab === 'tcsb');
  if(fb) fb.style.display = showFb ? '' : 'none';
  if(es) es.style.display = showEs ? '' : 'none';
  if(tc) tc.style.display = showTc ? '' : 'none';
  // 有模式鈕時由它靠右；沒有時換「＋新增項目」自己靠右
  if(ab) ab.style.marginLeft = (showFb || showEs || showTc) ? '' : 'auto';
  if(showTc && tc){
    if(tcsbAutoMode === true){
      tc.style.background='rgba(34,197,94,.18)'; tc.style.color='#22c55e';
      tc.textContent='🚀 自動送出訂單:開（取貨付款）';
    }else if(tcsbAutoMode === false){
      tc.style.background='rgba(245,158,11,.18)'; tc.style.color='#f59e0b';
      tc.textContent='✋ 手動送出:開（點此切自動送出訂單）';
    }else{
      tc.style.background='#242832'; tc.style.color='#8b93a1'; tc.textContent='下單模式…';
    }
  }
  if(showFb && fb){
    if(fbAutoMode === true){
      fb.style.background='rgba(34,197,94,.18)'; fb.style.color='#22c55e';
      fb.textContent='🚀 自動立即結帳:開（貨到付款）';
    }else if(fbAutoMode === false){
      fb.style.background='rgba(245,158,11,.18)'; fb.style.color='#f59e0b';
      fb.textContent='✋ 手動確認:開（點此切自動立即結帳）';
    }else{
      fb.style.background='#242832'; fb.style.color='#8b93a1'; fb.textContent='下單模式…';
    }
  }
  if(showEs && es){
    if(esAutoMode === true){
      es.style.background='rgba(34,197,94,.18)'; es.style.color='#22c55e';
      es.textContent='🚀 自動確認結帳:開（超商取貨付款）';
    }else if(esAutoMode === false){
      es.style.background='rgba(245,158,11,.18)'; es.style.color='#f59e0b';
      es.textContent='✋ 手動確認:開（點此切自動確認結帳）';
    }else{
      es.style.background='#242832'; es.style.color='#8b93a1'; es.textContent='下單模式…';
    }
  }
}
async function toggleTcsbMode(){
  const want = !(tcsbAutoMode === true);
  const msg = want
    ? '墊腳石切換為「自動送出訂單」？\n\n有貨 → 後端自動加購物車 → 結帳頁自動選好全家取貨付款＋門市＋發票 → 自動按「送出訂單」。\n只走取貨付款（貨到付款），信用卡等一律不碰、不送出；門市沒帶入也不會送。\n（不想要的訂單不去取貨即自動取消）\n\n※ 已開著的墊腳石結帳頁要重新整理才會套用新模式'
    : '墊腳石切換為「手動送出」？\n\n一切自動選好，最後「送出訂單」由你自己按。\n\n※ 已開著的墊腳石結帳頁要重新整理才會套用新模式';
  if(!confirm(msg)) return;
  try{
    const r = await fetch('/api/tcsb_mode',{method:'POST',headers:{'Content-Type':'application/json'},
      body: JSON.stringify({auto: want})});
    const d = await r.json();
    tcsbAutoMode = d.auto;
    updateFbModeBtn();
    toast('墊腳石已切換：'+(d.auto?'自動送出訂單（取貨付款）':'手動送出')+(d.config_changed?'（config 已更新）':'（config 寫入失敗！）'), d.config_changed?'ok':'err');
  }catch(e){ toast('切換失敗：連不到伺服器', 'err'); }
}
async function toggleEsMode(){
  const want = !(esAutoMode === true);
  const msg = want
    ? '誠品切換為「自動確認結帳」？\n\n有貨 → 自動加購物車 → step2 選 7-11 取貨＋超商取貨付款＋近期地址 → 勾同意條款 → 自動按「確認結帳」送出。\n只走超商取貨付款（貨到付款），信用卡等一律不碰、不送出；門市沒帶入也不會送。\n（不想要的訂單不去取貨即自動取消）\n\n※ 已開著的誠品分頁要重新整理才會套用新模式'
    : '誠品切換為「手動確認」？\n\n一切自動選好，最後「確認結帳」由你自己按。\n\n※ 已開著的誠品分頁要重新整理才會套用新模式';
  if(!confirm(msg)) return;
  try{
    const r = await fetch('/api/eslite_mode',{method:'POST',headers:{'Content-Type':'application/json'},
      body: JSON.stringify({auto: want})});
    const d = await r.json();
    esAutoMode = d.auto;
    updateFbModeBtn();
    toast('誠品已切換：'+(d.auto?'自動確認結帳（超商取貨付款）':'手動確認')+(d.config_changed?'（config 已更新）':'（config 寫入失敗！）'), d.config_changed?'ok':'err');
  }catch(e){ toast('切換失敗：連不到伺服器', 'err'); }
}
async function toggleFbMode(){
  const want = !(fbAutoMode === true);
  const msg = want
    ? '切換為「自動立即結帳」？\n\n有貨 → 加購物車 → 選 7-11 貨到付款 → 自動按「立即結帳」完成下單。\n不是貨到付款絕不送出；同商品只自動下 1 單。\n（不想要的訂單不去取貨即自動取消）\n\n※ 已開著的 funbox 分頁要重新整理才會套用新模式'
    : '切換為「手動確認」？\n\n一切自動選好，最後「立即結帳」由你自己按。\n\n※ 已開著的 funbox 分頁要重新整理才會套用新模式';
  if(!confirm(msg)) return;
  try{
    const r = await fetch('/api/fb_mode',{method:'POST',headers:{'Content-Type':'application/json'},
      body: JSON.stringify({auto: want})});
    const d = await r.json();
    fbAutoMode = d.auto;
    updateFbModeBtn();
    toast('已切換：'+(d.auto?'自動立即結帳（貨到付款）':'手動確認')+(d.config_changed?'（config 已更新）':'（config 寫入失敗！）'), d.config_changed?'ok':'err');
  }catch(e){ toast('切換失敗：連不到伺服器', 'err'); }
}
function updateStoreBtn(){
  const b = document.getElementById('storeBtn');
  const cb = document.getElementById('cartBtn');
  const ab = document.getElementById('addBtn');

function prioBadge(store, name){

  const list = (lastState && lastState.priority && lastState.priority[store]) || [];
  const idx = list.indexOf(name);
  const b = document.createElement('button');
  b.className = 'prio' + (idx>=0 ? ' set' : '');

async function cyclePriority(store, name){
  let list = (((lastState||{}).priority||{})[store] || []).slice();
  const i = list.indexOf(name);
  if(i>=0){ list.splice(i,1); }                 // 已在名單 → 移除（其餘自動遞補編號）
  else {
    if(list.length>=3){ toast('每頁最多 3 個優先，先取消一個再設', 'err'); return; }
    list.push(name);                             // 不在 → 加到最後（＝下一個名次）
  }
  if(lastState){ lastState.priority = lastState.priority||{}; lastState.priority[store]=list; render(lastState); }  // 樂觀更新
  try{
    const r=await fetch('/api/priority',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({store:store, priority:list})});
    const d=await r.json();
    if(d.ok){
      if(lastState){ lastState.priority[store]=d.priority; }
      toast('搶購優先級：'+(d.priority.length? d.priority.map((n,k)=>(k+1)+'.'+n).join('　') : '已清空')
            +(d.config_changed?'（config 已更新）':'（config 寫入失敗）'), d.config_changed?'ok':'err');
    }else{ toast('設定失敗：'+(d.reason||'?'), 'err'); }

}

function reasonMsg(d){
  switch(d.reason){

    case 'cart_unchanged': return {msg:'⚠ 送出成功但購物車沒增加 — cookie 可能與瀏覽器不同步，請重新複製 cookie', ok:false};
    case 'no_cookie':  return {msg:'⚠ 未填 session_cookie（config.json），無法下單', ok:false};
    case 'logged_out': return {msg:'⚠ cookie 已失效或未登入，請重新複製 cookie', ok:false};
    case 'network':    return {msg:'❌ 連不到 funbox：'+(d.detail||''), ok:false};
    default:           return {msg:'❌ 失敗 ('+(d.reason || ('HTTP '+(d.status||'?')))+')', ok:false};
  }
}

function beep(){
  // 輕柔單音（音量小，不吵到旁人）；主要提醒靠彈窗＋桌面通知
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type='sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.08, ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.35);
    o.start(); o.stop(ctx.currentTime+0.36);
  }catch(e){}
}

function renderMm(state){
  const cards=document.getElementById('cards');
  document.getElementById('controlbar').style.display='none';
  const banner=document.getElementById('banner'); banner.className='show good';
  // M.M小舖是 BVSHOP／Vue 前端渲染：規格庫存只有瀏覽器渲染後才存在，
  // server 用 HTTP 抓永遠看不到。所以這一分頁是「反向」的 —— 由 mm_grab.user.js 回報。
  banner.textContent='🧩 M.M小舖：config/mm.json 只放型號，程式啟動自動開「1 個巡邏分頁」依序走訪所有目標 —— '
    +'還沒找到的去搜尋、找到的讀規格庫存、有貨自動加入購物車。那個分頁保持開著即可（可縮到最小）。'
    +'結帳與備註暗語由你自己填 —— 商品已經在購物車裡，不用跟時間賽跑。';
  const to=state.mm||{}; cards.innerHTML='';
  // 分頁被關掉時一鍵重開（server 會重新帶暗號開所有 config 目標）
  if(Object.keys(to).length){
    const bar=document.createElement('div');
    bar.className='meta'; bar.style.cssText='padding:4px 12px 10px;grid-column:1/-1';
    const rb=document.createElement('button');
    rb.textContent='🔄 重新開啟巡邏分頁';
    rb.style.cssText='padding:7px 14px;border:0;border-radius:8px;cursor:pointer;background:#1f6feb;color:#fff;font-weight:700';
    rb.addEventListener('click', async ()=>{
      rb.disabled=true; rb.textContent='開啟中…';
      try{
        const r=await fetch('/api/mm_open',{method:'POST'});
        const d=await r.json();
        rb.textContent='已開 '+(d.opened||[]).length+' 個分頁';
      }catch(e){ rb.textContent='開啟失敗'; }
      setTimeout(()=>{rb.disabled=false; rb.textContent='🔄 重新開啟巡邏分頁';}, 3000);
    });
    bar.appendChild(rb);
    cards.appendChild(bar);
  }
  const vals=Object.values(to).sort((a,b)=>(b.lastSeen||'').localeCompare(a.lastSeen||''));
  if(!vals.length){
    cards.innerHTML='<div class="meta" style="padding:12px">尚未設定 M.M 目標。<br><br>'
      +'1. 安裝 <b>mm_grab.user.js</b>（Tampermonkey）<br>'
      +'2. 把商品加進 <b>config/mm.json</b> 的 targets：<br>'
      +'<code>{"name":"CX-01 蒼龍勇氣","url":"https://mmtoyshop.com/item/...","spec":"不可搭"}</code><br>'
      +'3. 重開程式 → 監看分頁會自動開、自動盯<br><br>'
      +'（也可以不改 config，直接在商品頁右下角面板手動「開始監看」）</div>';
    return;
  }
  const nowMs=Date.now();
  vals.forEach(function(c){
    const k=c.url||c.name;
    const buyable=(c.buyable===true);
    if(buyable && !prevMm[k]){ beep(); desktopNotify('🧩 M.M有貨：'+(c.name||''), (c.specText||'')+' 庫存 '+c.stock); }
    prevMm[k]=buyable;
    // lastSeen 是台灣本地時間字串，直接用 Date 解析（跟後端同一台機器）
    const seen=c.lastSeen? new Date(c.lastSeen.replace(/-/g,'/')) : null;
    const quietMin = seen? Math.round((nowMs-seen.getTime())/60000) : null;
    const stale = c.watching && quietMin!==null && quietMin>10;
    const card=document.createElement('div'); card.className='card'+(c.watching?'':' disabled');
    let badge;
    if(c.addedAt) badge='<span class="badge b-buy">🛒 已加入購物車 '+c.addedAt+'</span>';
    else if(c.buyable===true) badge='<span class="badge b-buy">🟢 規格有貨（庫存 '+c.stock+'）</span>';
    else if(c.buyable===false) badge='<span class="badge b-out">補貨中 / 庫存 '+(c.stock==null?'?':c.stock)+'</span>';
    else if(c.phase==='searching') badge='<span class="badge b-out">🔍 搜尋商品頁中（可能還沒上架）</span>';
    else if(!c.lastSeen) badge='<span class="badge b-out">等待腳本回報…</span>';
    else badge='<span class="badge b-out">庫存讀不到</span>';
    const watchTxt = c.watching
      ? (stale? '<div class="result rerr">⚠ 顯示為監看中，但已經 '+quietMin+' 分鐘沒回報 —— 分頁可能被關掉或腳本停了</div>'
              : '<div class="meta">👁 監看中</div>')
      : '<div class="meta">⏸ 未監看</div>';
    const tgt = c.targetSpec ? ('目標規格：'+c.targetSpec) : '目標規格：（用頁面上目前選中的）';
    card.innerHTML='<div class="mrow"><span class="model" style="font-size:14px">'+(c.name||'').slice(0,52)+'</span></div>'+badge
      +'<div class="title" style="color:#8b93a1">'+tgt+'</div>'
      +(c.phase==='searching' ? '' : '<div class="title" style="color:#8b93a1">目前選中：'+(c.specText||'—')
      +(c.specId?('　｜　spec '+c.specId):'')+'</div>')
      +'<div class="title" style="color:#8b93a1">最後回報 '+(c.lastSeen||'—')+'</div>'
      +'<a class="link" href="'+(c.url||'#')+'" target="_blank">前往商品頁 ↗</a>'+watchTxt;
    card.appendChild(rmvBtn('mm', c.name));
    cards.appendChild(card);
  });
}

function renderLog(state){
  const cards=document.getElementById('cards');
  document.getElementById('controlbar').style.display='none';
  const banner=document.getElementById('banner'); banner.className='show good';
  banner.textContent='📋 動作紀錄：每次偵測到有貨、加入購物車、失敗都會留下時間。關掉程式也會保存（events.jsonl）。';
  const evs=state.events||[];
  cards.style.display='block';
  if(!evs.length){ cards.innerHTML='<div class="meta" style="padding:12px">還沒有任何動作紀錄。偵測到有貨時就會出現在這裡。</div>'; return; }

  // 上方統計：今天成功加入幾件、失敗幾次
  // 用「本地日期」比對：後端寫的是台灣時間，用 UTC 會讓凌晨的紀錄算到前一天
  const _d=new Date();
  const today=_d.getFullYear()+'-'+String(_d.getMonth()+1).padStart(2,'0')+'-'+String(_d.getDate()).padStart(2,'0');
  const todays=evs.filter(e=>(e.ts||'').slice(0,10)===today);
  const okCnt=todays.filter(e=>e.ok===true&&/加入購物車/.test(e.action)).length;
  const badCnt=todays.filter(e=>e.ok===false).length;
  const hitCnt=todays.filter(e=>/有貨|開商品頁|準點搶/.test(e.action)).length;

  let html='<div class="sumbar">'+
    '<span>今日偵測到動作 <b>'+hitCnt+'</b> 次</span>'+
    '<span>成功加入購物車 <b class="ev-ok">'+okCnt+'</b> 件</span>'+
    '<span>失敗 <b class="ev-bad">'+badCnt+'</b> 次</span>'+
    '<span>總紀錄 <b>'+evs.length+'</b> 筆</span></div>';

  html+='<table class="log"><thead><tr><th>時間</th><th>商店</th><th>品項</th><th>動作</th><th>說明</th></tr></thead><tbody>';
  evs.forEach(function(e){
    const cls = e.ok===true ? 'ev-ok' : (e.ok===false ? 'ev-bad' : 'ev-info');
    const link = e.url ? ' <a class="link" href="'+e.url+'" target="_blank">↗</a>' : '';
    html+='<tr><td class="ev-time">'+(e.ts||'')+'</td>'+
          '<td><span class="ev-store">'+(e.storeName||e.store||'')+'</span></td>'+
          '<td>'+(e.item||'')+link+'</td>'+
          '<td class="'+cls+'">'+(e.action||'')+'</td>'+
          '<td style="color:#8b93a1">'+(e.detail||'')+'</td></tr>';
  });
  html+='</tbody></table>';
  cards.innerHTML=html;
}

function render(state){
  lastState = state;
  // config 檔壞掉（JSON 打錯字）→ 該店會無聲消失，這裡大聲顯示
  const ce=document.getElementById('cfgerr');
  if(ce){
    const errs=(state.config_errors||[]).slice();
    if(state.tcsb_login_lost) errs.unshift('墊腳石未登入 — 請到瀏覽器重新登入墊腳石（記得勾記住我），否則有貨無法自動加入');
    ce.style.display = errs.length ? '' : 'none';
    ce.textContent = errs.length ? ('⛔ '+errs.join('　｜　')) : '';
  }
  const cardsEl=document.getElementById('cards');
  if(cardsEl) cardsEl.style.display = (activeTab==='log') ? 'block' : 'grid';
  if(Array.isArray(state.disabled)) disabledSet = new Set(state.disabled);
  if(activeTab === 'log'){ renderLog(state); return; }
  if(activeTab === 'mm'){ renderMm(state); return; }
  if(activeTab === 'ehobby'){ renderEhobby(state); return; }
  if(activeTab === 'tcsb'){ renderTcsb(state); return; }
  if(activeTab === 'momo'){ renderMomo(state); return; }
  if(activeTab === 'eslite'){ renderEslite(state); return; }
  document.getElementById('clock').innerHTML =
    '<span class="dot" style="background:var(--green)"></span>最後查詢 ' + (state.last_checked||'--');
  const cards = document.getElementById('cards');
  const targets = state.targets || {};
  cards.innerHTML = '';
  Object.values(targets).forEach(t=>{
    // beep when a model flips from not-buyable to buyable (extra alert if selected)
    if(t.buyable && !prevBuyable[t.model]){
      beep();
      desktopNotify('🔔 Funbox 上架：'+t.model, (t.title||t.model)+' — 已自動加入購物車，快去結帳！');
      toast('🔔 上架：'+t.model, 'ok');
    }
    prevBuyable[t.model] = t.buyable;

    const card = document.createElement('div');
    card.className = 'card';
    let badge = '<span class="badge b-off">未上架</span>';
    if(t.listed && t.buyable) badge = '<span class="badge b-buy">🟢 上架・可購買</span>';
    else if(t.listed && !t.buyable) badge = '<span class="badge b-out">售完 / 無法購買</span>';

    const canBuy = t.listed && t.buyable && t.variant_id;
    const btnCls = canBuy ? 'confirm ready' : 'confirm disabled';
    const btnTxt = canBuy ? '確認加入購物車' : '尚無法購買';
    const link = t.url ? '<a class="link" href="'+t.url+'" target="_blank">開商品頁 ↗</a>' : '';

    const res = results[t.model];
    const autoEnabled = !isOff('funbox', t.model);
    if(!autoEnabled) card.className += ' disabled';

    let autoNote = '';
    if(!autoEnabled) autoNote = '<div class="result rerr">⛔ 已停用自動加入（有貨也不會放入）</div>';
    else if(t.autoAdded) autoNote = '<div class="result rok">⚡ 已自動加入購物車'+(t.autoAddedAt?'　'+t.autoAddedAt:'')+'，去結帳付款</div>';
    else if(autoAddOn && canBuy) autoNote = '<div class="result rok">🟢 可購買・自動加入中…</div>';

    // 每張卡的「自動加入 開/關」切換鈕
    const tglHtml = '<button class="autotgl '+(autoEnabled?'on':'off')+'">'+(autoEnabled?'自動:開':'自動:關')+'</button>';

    // auto_add 開時隱藏勾選框與確認鈕；關時保留手動操作
    const pickHtml = autoAddOn ? '' : '<label class="pick"><input type="checkbox" '+(selected[t.model]?'checked':'')+'> 要買（加入批次）</label>';
    const btnHtml = autoAddOn ? '' : '<button class="buybtn '+btnCls+'" '+(canBuy?'':'disabled')+'>'+btnTxt+'</button>';

    card.innerHTML =
      '<div class="mrow"><span class="model">'+t.model+'</span>'+tglHtml+'</div>' +
      pickHtml + badge +
      '<div class="title">'+(t.title||'&nbsp;')+'</div>' +
      link + btnHtml +
      '<div class="result '+(res?(res.ok?'rok':'rerr'):'')+'">'+(res?res.msg:'')+'</div>' +
      autoNote;

    card.querySelector('.autotgl').addEventListener('click', ()=>toggleAuto('funbox', t.model, !autoEnabled));
    if(!autoAddOn){
      const pk = card.querySelector('.pick input');
      if(pk) pk.addEventListener('change', ev=>toggleSel(t.model, ev.target.checked));
      if(canBuy){
        const bb = card.querySelector('button.buybtn');
        if(bb) bb.addEventListener('click', ev=>addToCart(t.model, t.variant_id, ev.target));
      }
    }
    card.appendChild(rmvBtn('funbox', t.model));
    card.appendChild(prioBadge('funbox', t.model));
    cards.appendChild(card);
  });
  updateControlBar(state);
}

async function tick(){
  try{
    const [s, h] = await Promise.all([
      fetch('/api/status').then(r=>r.json()),
      fetch('/api/health').then(r=>r.json()).catch(()=>null)
    ]);
    autoAddOn = !!(h && h.auto_add);
    if(s && s.stores){ storesState = s.stores; updateStoreBtn(); }
    render(s);
    if(activeTab === 'funbox') updateBanner(h);
  }catch(e){
    document.getElementById('clock').innerHTML =
      '<span class="dot" style="background:var(--red)"></span>伺服器未連線';
  }
}

const CART_URL = { funbox: 'https://shop.funbox.com.tw/cart', eslite: 'https://www.eslite.com/cart/step2', momo: 'https://www.momoshop.com.tw/main/Main.jsp', tcsb: 'https://www.tcsb.com.tw/checkout/cart', ehobby: 'https://www.ehobbyshop.com.tw/checkout/cart', mm: 'https://mmtoyshop.com/cart' };
function updateCartBtn(){
  var label = { funbox:'🛒 Funbox 購物車', eslite:'🛒 誠品購物車', momo:'🛒 開 momo（登入後點購物車）', tcsb:'🛒 墊腳石購物車', ehobby:'🛒 東海購物車', mm:'🛒 M.M小舖購物車' };
  document.getElementById('cartBtn').textContent = label[activeTab] || label.funbox;
}
document.getElementById('cartBtn').addEventListener('click', function(){
  let u = CART_URL[activeTab] || CART_URL.funbox;
  // funbox：帶上當前下單模式的暗號 —— 自動模式下你自己開購物車，腳本也會接手跑完
  if(activeTab === 'funbox' && fbAutoMode !== null){
    u += (u.indexOf('?')>=0?'&':'?') + 'fborder=' + (fbAutoMode ? '1' : '0');
  }
  window.open(u, '_blank');
});
document.querySelectorAll('.tab').forEach(function(btn){
  btn.addEventListener('click', function(){
    activeTab = btn.getAttribute('data-tab');
    document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b===btn));
    updateCartBtn();
    updateStoreBtn();
    if(lastState) render(lastState);
  });
});
const ADD_HINT = {
  funbox: '輸入型號（例如 UX-21）：',
  eslite: '輸入誠品搜尋關鍵字（要精確，例如 戰鬥陀螺 UX-21）：',
  momo:   '貼上 momo 商品網址（或純數字 i_code）：',
  tcsb:   '輸入關鍵字，或貼商品網址／條碼：',
  ehobby: '輸入型號或商品名片段（例如 UX-21；已上架的會自動找到並轉盯庫存）：',
  mm:     '輸入型號（例如 UX-21；巡邏分頁下一輪自動生效）：'
};
async function addTarget(){
  const store = activeTab;
  if(!(store in ADD_HINT)){ toast('這個分頁不能新增', 'err'); return; }
  const v = prompt(ADD_HINT[store]);
  if(v===null || !v.trim()) return;
  let name = '';
  if(store==='momo'){
    name = prompt('顯示名稱（選填，例如 UX-22 ○○○；留空就用 i_code）：') || '';
  }
  try{
    const r = await fetch('/api/add_target',{method:'POST',headers:{'Content-Type':'application/json'},
      body: JSON.stringify({store:store, value:v.trim(), name:name.trim()})});
    const d = await r.json();
    if(d.ok){
      toast('已新增 '+d.name+'（config 已更新'+(store==='mm'?'，巡邏下一輪生效':'，下一輪偵測生效')+'）', 'ok');
      await tick();
    }else{
      toast('新增失敗：'+(d.reason||'?'), 'err');
    }
  }catch(e){ toast('新增失敗：連不到伺服器', 'err'); }
}
document.getElementById('addBtn').addEventListener('click', addTarget);
document.getElementById('fbModeBtn').addEventListener('click', toggleFbMode);
document.getElementById('esModeBtn').addEventListener('click', toggleEsMode);
document.getElementById('tcsbModeBtn').addEventListener('click', toggleTcsbMode);
document.getElementById('mailBtn').addEventListener('click', editMailTo);
document.getElementById('to_add').addEventListener('click', mailAdd);
document.getElementById('to_close').addEventListener('click', function(){ document.getElementById('toModal').style.display='none'; });
document.getElementById('to_new').addEventListener('keydown', function(e){ if(e.key==='Enter') mailAdd(); });
document.getElementById('toModal').addEventListener('click', function(e){ if(e.target===this) this.style.display='none'; });
document.getElementById('bindBtn').addEventListener('click', bindSender);
document.getElementById('mm_open').addEventListener('click', function(){
  window.open('https://myaccount.google.com/apppasswords', '_blank');
});
document.getElementById('mm_cancel').addEventListener('click', closeMailModal);
document.getElementById('mm_save').addEventListener('click', saveMailSender);
document.getElementById('mm_show').addEventListener('change', function(e){
  document.getElementById('mm_pw').type = e.target.checked ? 'text' : 'password';
});
document.getElementById('mailModal').addEventListener('click', function(e){
  if(e.target === this) closeMailModal();
});
document.getElementById('storeBtn').addEventListener('click', toggleStore);
updateCartBtn();
updateStoreBtn();
document.getElementById('batchBtn').addEventListener('click', confirmBatch);
document.getElementById('refreshBtn').addEventListener('click', async (ev)=>{
  const b = ev.currentTarget;
  b.disabled = true; const orig = b.textContent; b.textContent = '偵測中…';
  try{ await fetch('/api/refresh', {method:'POST'}); }catch(e){}
  // poll quickly for a few seconds so fresh results show right away
  for(let i=0;i<10;i++){ await new Promise(r=>setTimeout(r,400)); await tick(); }
  b.disabled = false; b.textContent = orig;
});
document.getElementById('selAll').addEventListener('change', ev=>{
  if(!lastState) return;
  const t = lastState.targets || {};
  if(ev.target.checked){ Object.values(t).forEach(x=>{ if(x.buyable) selected[x.model]=true; }); }
  else{ Object.values(t).forEach(x=>{ delete selected[x.model]; }); }
  saveSel(); render(lastState);
});

// 請求桌面通知權限（讓你切到別的視窗也收得到上架通知）
try{ if('Notification' in window && Notification.permission==='default') Notification.requestPermission(); }catch(e){}

tick();
setInterval(tick, 3000);
</script>
</body>
</html>
